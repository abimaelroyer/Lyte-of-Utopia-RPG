    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#lou-high *{box-sizing:border-box}#lou-high [hidden]{display:none!important}#lou-high header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px;border-bottom:1px solid var(--line)}#lou-high header p{margin:3px 0;color:var(--muted)}#lou-high main{padding:20px}#lou-high strong,#lou-high h3{font-weight:500}#lou-high button,#lou-high select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:44px;padding:9px 12px;max-width:100%}#lou-high button{cursor:pointer}#lou-high button:disabled{opacity:.48;cursor:default}#lou-high button[aria-pressed=true],#lou-high .primary{background:var(--selected)}#lou-high nav,#lou-high .categories,#lou-high .playbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}#lou-high label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#lou-high .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin:15px 0}#lou-high .settings label{display:grid}#lou-high summary{min-height:36px;cursor:pointer}#lou-high details{border-bottom:1px solid var(--line);padding:10px 0}#lou-high p{margin:8px 0}#lou-high .turnline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}#lou-high .fighters{display:grid;grid-template-columns:1fr 1fr;gap:16px}#lou-high .fighter-card,#lou-high .preview{background:var(--panel);padding:16px;border-radius:8px;min-width:0}#lou-high .pair{display:flex;justify-content:space-between;gap:12px;margin:6px 0;flex-wrap:wrap}#lou-high .bar{height:6px;background:var(--line);margin:4px 0 10px}#lou-high .bar span{display:block;height:100%;background:light-dark(#648ba8,#9ac3e2)}#lou-high .layers{color:var(--muted);min-height:42px;margin:8px 0}#lou-high .arena{min-height:244px;display:flex;justify-content:space-between;align-items:flex-end;position:relative;isolation:isolate;background:var(--panel);border-radius:8px;padding:8px 24px;overflow:hidden;margin:12px 0}#lou-high .actor{position:relative;flex:0 0 192px;text-align:center;min-width:0;z-index:1}#lou-high .sprite{position:relative;z-index:2;width:192px;height:216px;background-size:768px 216px;background-repeat:no-repeat;image-rendering:pixelated;animation:high-frames .65s steps(4) infinite}#lou-high .right .sprite{transform:scaleX(-1)}#lou-high .aura{position:absolute;inset:0;z-index:0;opacity:.8;pointer-events:none}#lou-high .aura-gold{background:radial-gradient(ellipse,transparent 48%,#edc64f66 58%,transparent 70%)}#lou-high .aura-orange{background:linear-gradient(90deg,transparent 5%,#db741877 16%,transparent 30%,transparent 70%,#db741877 85%,transparent 95%);box-shadow:inset 4px 0 #e0803055,inset -4px 0 #e0803055}#lou-high .aura-violet{background:radial-gradient(ellipse,transparent 42%,#895cda77 57%,transparent 70%)}#lou-high .sprite.aura-white{background-size:768px 216px;opacity:.85}#lou-high .spirit-mote{position:absolute;right:5px;top:18px;width:16px;height:16px;background:#fff1b8;box-shadow:0 0 0 4px #cca44a77;z-index:3}#lou-high .spirit-mote.moon{background:#dceeff;box-shadow:0 0 0 4px #809fce77}#lou-high .ghost{position:absolute;left:-20px;top:10px;opacity:.25;scale:.85;z-index:0}#lou-high .ghost.second{left:22px;top:-12px}#lou-high .hit-number{position:absolute;top:60px;left:0;right:0;z-index:5;background:var(--bg);padding:5px}#lou-high .takes-hit .sprite:not(.aura){filter:brightness(1.7)}#lou-high .art-beam{position:absolute;z-index:4;height:16px;left:25%;right:25%;top:43%;background:#ffeaa3;box-shadow:0 5px #ce993c,0 -5px #ce993c;animation:high-beam .75s steps(4) both;transform-origin:left}#lou-high .art-beam.dark{background:#241630;box-shadow:0 5px #9060ce,0 -5px #9060ce;transform-origin:right}#lou-high .action-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}#lou-high .moves{display:grid;grid-template-columns:1fr 1fr;gap:7px}#lou-high .moves button{text-align:left}#lou-high .track{display:flex;background:var(--panel);height:10px;margin:6px 0 12px}#lou-high .startup{background:light-dark(#79a7c8,#598cb1)}#lou-high .recovery{background:light-dark(#ad9bc4,#84749e)}#lou-high .muted{color:var(--muted)}#lou-high .profile-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}#lou-high table{width:100%;border-collapse:collapse}#lou-high th,#lou-high td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}#lou-high .replay{border:1px solid var(--line);padding:12px;border-radius:8px}#lou-high .history p{margin:3px 0}#lou-high .profile-grid .actor{margin:auto}#lou-high .status-list{color:var(--muted)}
@keyframes high-frames{to{background-position:-768px 0}}@keyframes high-beam{0%{scale:.1 1}40%,85%{scale:1 1}100%{opacity:0}}
@media(max-width:650px){#lou-high main{padding:12px}#lou-high .fighters,#lou-high .action-layout,#lou-high .profile-grid{grid-template-columns:1fr}#lou-high .arena{padding:4px 0;min-height:182px}#lou-high .actor{flex-basis:128px}#lou-high .sprite{width:128px;height:144px;background-size:512px 144px;animation-name:high-small}#lou-high .sprite.aura-white{background-size:512px 144px}#lou-high .profile-grid .actor{width:128px}#lou-high .ghost{left:0}#lou-high .ghost.second{left:8px}#lou-high th,#lou-high td{padding:7px 3px}}
@keyframes high-small{to{background-position:-512px 0}}
@media(prefers-reduced-motion:reduce){#lou-high .sprite,#lou-high .art-beam{animation:none!important}}

/* v0.6: resources first, combined modifiers, detail on demand. */
#lou-high header{padding:16px 20px}#lou-high main{padding:16px 20px}
#lou-high .fighter-card{padding:14px}#lou-high .fighter-card&gt;.pair:first-child{font-weight:500;margin-top:0}
#lou-high .pool-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
#lou-high .meter{min-width:0}#lou-high .meter .pair{font-size:12px;gap:4px;margin:5px 0}
#lou-high .meter-hp .pair{font-size:14px}#lou-high .bar{height:7px;margin:0 0 7px;border-radius:2px;overflow:hidden}
#lou-high .meter-hp .bar{height:10px}
#lou-high .meter-hp .bar span{background:light-dark(#477f65,#7bbd9b)}
#lou-high .meter-aether .bar span{background:light-dark(#4b82ab,#85bde5)}
#lou-high .meter-focus .bar span{background:light-dark(#a17f30,#d9be71)}
#lou-high .meter-stamina .bar span{background:light-dark(#5f8a47,#9cbb7e)}
#lou-high .meter-will .bar span{background:light-dark(#8b69a8,#b99bdb)}
#lou-high .ratios{margin:5px 0;font-variant-numeric:tabular-nums}
#lou-high .ratios th,#lou-high .ratios td{padding:2px 6px;border:0;font-size:12px}
#lou-high .ratios th{color:var(--muted);font-weight:400}#lou-high .ratios th:first-child,#lou-high .ratios td:first-child{padding-left:0}
#lou-high .ratios td:not(:first-child),#lou-high .ratios th:not(:first-child){text-align:right}
#lou-high .fighter-card&gt;.pair{font-size:12px}#lou-high .fighter-card&gt;.pair:first-child{font-size:14px}
#lou-high .fighter-card details{padding:0;border:0}#lou-high .fighter-card summary{min-height:30px;padding:3px 0;color:var(--muted)}
#lou-high .layer-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0}#lou-high .layer-row span{min-width:0}
#lou-high .timing-details{margin:12px 0}#lou-high .replay-values{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#lou-high .history&gt;details{padding:12px 0}#lou-high .history details details{border:0;margin:6px 0;padding:0}
#lou-high .event-resource{font-variant-numeric:tabular-nums}#lou-high .history button{margin-top:8px}
#lou-high .fighter-card .pair span:last-child,#lou-high .meter .pair span:last-child{font-variant-numeric:tabular-nums}
@media(max-width:650px){#lou-high main{padding:12px}#lou-high .replay-values{grid-template-columns:1fr}#lou-high select{font-size:16px}#lou-high .pool-grid{gap:0 10px}}

&lt;h3&gt;What this build tests&lt;/h3&gt;&lt;p&gt;Choose either character or control both locally. Start in base to learn activation costs; choose War for sustained high-level play or Peak to test maximum pressure and upkeep. This is a recovered, pre-death Arc IV loadout, not a later Primordial/Omni Akira build.&lt;/p&gt;
&lt;h3&gt;Stack compatibility&lt;/h3&gt;&lt;p&gt;Each layer has a slot. Core, pressure, soul resonance, amplifier, cloak, shroud and Spirit blessing may coexist when compatible. A new entry replaces another in the same slot. Divine Pressure improves efficiency; it is not a universal gate for Divine techniques.&lt;/p&gt;&lt;p&gt;Akira’s Exponential route replaces his other soul state, removes Golden Energy Mode and astral clones, and blocks new arrays. Magnitudes escalate 1 → 7 → 12. Photoreception uses the Sun as its sole fuel source and keeps only Divine Pressure and Solar Pressure alongside it in this test. Rikito’s Infuscate requires his Perfect Demon Form as a prototype compatibility gate. Solar and Lunar Pressure remain blessings, not Forms.&lt;/p&gt;
&lt;h3&gt;Tick rules&lt;/h3&gt;&lt;p&gt;Costs are spent at commitment, effects land after startup, and recovery ends at the next decision tick. Waiting in menus never advances time. Speed affects new actions, not ones already committed. Same-tick form/defense effects resolve before attacks, then attack damage is batched before checking knockouts. An Art that Dragon Festival nullifies loses its spent costs.&lt;/p&gt;
&lt;h3&gt;Spirit and Ego experiments&lt;/h3&gt;&lt;p&gt;One aether meter contains native capacity, core contributions, and linked Spirit capacity. Introspection controls the contribution fraction and resistance to experimental Ego pressure. Will maintains soul/Spirit layers and funds Ego techniques. Empty Will removes those layers; empty aether ends every layer and sustained healing. Spirits do not disappear from the maximum pool when a blessing is switched off.&lt;/p&gt;
&lt;p&gt;Ego pressure, Recenter, Ego brace, Move Cancels, all numeric Spirit capacities and all perk values are game experiments—not newly asserted canon abilities. Shaken halves passive Focus gain. Move Cancel requires Agility 85, costs 3 Focus + 10 Will, keeps spent costs, and has a 60-tick cooldown. It cancels startup only, not recovery, transformations, Spirit actions or Sunburst.&lt;/p&gt;
&lt;h3&gt;Try these interactions&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;Create clones, then use Astral Substitution; verify it fails without a clone.&lt;/li&gt;&lt;li&gt;Read a signature, then interrupt a charging Art with Dragon Festival.&lt;/li&gt;&lt;li&gt;Compare Guard, evasive steps, Lunar Reflection and Ego brace against different attacks.&lt;/li&gt;&lt;li&gt;Stack Midnight and Archaic into a ruin finisher; compare its cost and timing with Black Lightning.&lt;/li&gt;&lt;li&gt;Escalate Exponential Spirit Resonance, watch the HP strain, and sustain it with regeneration.&lt;/li&gt;&lt;li&gt;Spend Rikito’s reserves, use Moon Drip, and try to use it again.&lt;/li&gt;&lt;li&gt;Compare Spirit-enabled and disabled matches; use a sealed arena to test environmental restrictions.&lt;/li&gt;&lt;li&gt;Replay an event and verify the live fight does not spend resources or change.&lt;/li&gt;&lt;/ol&gt;
&lt;h3&gt;Limits and provenance&lt;/h3&gt;&lt;p&gt;Based on the supplied Arc IV merged text—especially Cold World’s Descent, Magnitudes and One Shall Fall sequence—and the Misc. Moves notes. No true online PvP, positions, projectile travel, fusion, bespoke Covenants, campaigns or post-Arc-IV forms. The AI is deterministic and uses visible commitments; local control is a testing tool, not hidden simultaneous competitive selection.&lt;/p&gt;&lt;p&gt;Adult sprites are provisional adaptations of the supplied portraits. Several techniques share cast/strike poses. Aura accents identify active routes, but unique transformed bodies and every canon visual are not fully illustrated. Dedicated hit animations remain a flash and damage number.&lt;/p&gt;
&lt;/section&gt;

  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
